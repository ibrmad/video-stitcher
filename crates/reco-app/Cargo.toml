[package]
publish = false
name = "reco-app"
version = "0.5.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reco's app logic without a UI framework: the live preview session and its render worker"

[features]
# AI tracking in exports (Module 6b): reco-autocam with ONNX Runtime on the
# CPU, as reco-gui builds it; `coreml` adds Apple's engine.
default = ["ai"]
ai = ["dep:reco-autocam", "dep:reco-detect"]
coreml = ["ai", "reco-autocam/coreml"]

[dependencies]
reco-core = { path = "../reco-core" }
reco-autocam = { path = "../reco-autocam", optional = true }
reco-detect = { path = "../reco-detect", optional = true }
reco-io = { path = "../reco-io", features = ["ffmpeg", "config", "stacked-output"] }
reco-control = { path = "../reco-control" }
reco-calibrate = { path = "../reco-calibrate", features = ["io"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# Usage data's random client and batch ids (already in the lockfile).
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The version wgpu-hal 28 uses; only for raw Metal handles.
metal = "0.33"
