[package]
publish = false
name = "reco-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reco's app logic without a UI framework: the live preview session and its render worker"

[dependencies]
reco-core = { path = "../reco-core" }
reco-io = { path = "../reco-io", features = ["ffmpeg", "config"] }
reco-control = { path = "../reco-control" }
reco-calibrate = { path = "../reco-calibrate", features = ["io"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The version wgpu-hal 28 uses; only for raw Metal handles.
metal = "0.33"
