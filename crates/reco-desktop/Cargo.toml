[package]
publish = false
name = "reco-desktop"
version = "0.5.4"
# Makepad's macros (app_main!, script_mod!) are written for edition 2021.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reco's desktop app, built with Makepad 2 (see DESIGN.md)"

[features]
# AI tracking in exports, with ONNX Runtime by default; the detector
# backends are reco-app's (its Cargo.toml says which is which).
default = ["ai"]
ai = ["reco-app/ai", "reco-app/ort"]
coreml = ["ai", "reco-app/coreml"]
cuda = ["ai", "reco-app/cuda"]
tensorrt = ["ai", "reco-app/tensorrt"]
directml = ["ai", "reco-app/directml"]
load-dynamic = ["ai", "reco-app/load-dynamic"]
tensorrt-native = ["reco-app/tensorrt-native"]
ncnn = ["reco-app/ncnn"]
profiling = ["reco-app/profiling"]
# Benchmark hooks, kept from the Slint app (RECO_AUTOLOAD, RECO_AUTOEXPORT,
# RECO_VRAM_BUDGET_GB; automation.rs). Off in releases.
automation = []

[[bin]]
name = "reco-desktop"
path = "src/main.rs"

# The macOS app bundle `cargo makepad desktop bundle` makes (tools/package.py);
# an icon can go in resources/icon_1024.png.
[package.metadata.makepad.desktop]
name = "Reco"
identifier = "org.reco-project.reco"

[dependencies]
# Pinned per DESIGN.md Rule 3. The widget families are opt-in; the core
# has every widget Module 0 uses.
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "62691a290eb58f7d5234960524429aaada3e572c", default-features = false }
reco-app = { path = "../reco-app", default-features = false }
reco-io = { path = "../reco-io" }
serde_json = "1"

[dev-dependencies]
# Every key Makepad knows (KEYCODE_VARIANTS), so a test can find a handled
# key the shortcuts sheet doesn't list. Already in the lockfile.
makepad-key-code = { git = "https://github.com/makepad/makepad", rev = "62691a290eb58f7d5234960524429aaada3e572c" }
